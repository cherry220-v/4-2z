<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Task Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <h1 class="h3 mb-3 font-weight-normal text-secondary">
                        <i class="fas fa-tasks text-primary mr-2"></i>Task Manager
                    </h1>
                    <p class="text-muted">Создайте новый аккаунт для управления задачами</p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        
                        {% if error %}
                            <div class="alert alert-danger shadow-sm small" role="alert">
                                <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label for="email" class="small text-uppercase font-weight-bold text-muted">Email адрес</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white border-right-0"><i class="far fa-envelope text-muted"></i></span>
                                    </div>
                                    <input type="email" class="form-control border-left-0" id="email" name="email" value="{{ email|default:'' }}" placeholder="example@mail.com" required autocomplete="email">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="username" class="small text-uppercase font-weight-bold text-muted">Имя пользователя (Никнейм)</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white border-right-0"><i class="far fa-user text-muted"></i></span>
                                    </div>
                                    <input type="text" class="form-control border-left-0" id="username" name="username" value="{{ username|default:'' }}" placeholder="alex_pro" required autocomplete="username">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password" class="small text-uppercase font-weight-bold text-muted">Пароль</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white border-right-0"><i class="fas fa-lock text-muted"></i></span>
                                    </div>
                                    <input type="password" class="form-control border-left-0" id="password" name="password" placeholder="Минимум 6 символов" required autocomplete="new-password">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password_confirm" class="small text-uppercase font-weight-bold text-muted">Подтвердите пароль</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white border-right-0"><i class="fas fa-shield-alt text-muted"></i></span>
                                    </div>
                                    <input type="password" class="form-control border-left-0" id="password_confirm" name="password_confirm" placeholder="••••••••" required autocomplete="new-password">
                                </div>
                            </div>

                            <button class="btn btn-primary btn-block btn-lg shadow-sm mt-4" type="submit">
                                Зарегистрироваться <i class="fas fa-user-plus ml-1"></i>
                            </button>
                        </form>
                        
                    </div>
                </div>

                <div class="text-center mt-3">
                    <p class="text-muted small">Уже зарегистрированы? <a href="{% url 'login' %}" class="font-weight-bold">Войти в аккаунт</a></p>
                </div>

            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
